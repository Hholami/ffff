<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CFDs | تحديات التمويل الاحترافية</title>
  <!-- Font Awesome 6 + Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --border-light: #e2e8f0;
      --accent: #2563eb;
      --accent-gradient: linear-gradient(135deg, #2563eb, #1e40af);
      --accent-glow: rgba(37, 99, 235, 0.2);
      --shadow-sm: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      --shadow-hover: 0 25px 35px -12px rgba(0, 0, 0, 0.2);
      --badge-bg: #eef2ff;
      --badge-text: #1e40af;
      --transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      --glass-bg: rgba(255, 255, 255, 0.7);
    }

    body.dark {
      --bg-page: #0b1120;
      --card-bg: #1a2332;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #9ca3af;
      --border-light: #2d3a5e;
      --accent: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6, #2563eb);
      --accent-glow: rgba(59, 130, 246, 0.25);
      --badge-bg: #2d3a5e;
      --badge-text: #a5c9ff;
      --glass-bg: rgba(30, 41, 59, 0.6);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      transition: background 0.4s ease, color 0.3s ease;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle at 30% 40%, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }
    body.dark .bg-glow { opacity: 0.2; }

    .app-container {
      position: relative;
      z-index: 2;
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3.5rem;
      gap: 1.5rem;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      padding: 0.8rem 2rem;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .logo-area h1 {
      font-size: 1.9rem;
      font-weight: 800;
      background: var(--accent-gradient);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .logo-area h1 i {
      background: none;
      color: var(--accent);
    }
    .logo-area p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 5px;
      font-weight: 500;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .lang-switch {
      display: flex;
      background: var(--card-bg);
      border-radius: 48px;
      border: 1px solid var(--border-light);
      padding: 0.2rem;
    }

    .lang-btn {
      background: transparent;
      border: none;
      padding: 0.55rem 1.3rem;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 40px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .lang-btn.active {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 48px;
      padding: 0.55rem 1.2rem;
      display: flex;
      gap: 0.6rem;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 600;
    }

    .challenges-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 2.2rem;
      border-bottom: 2px solid var(--border-light);
      padding-bottom: 0.8rem;
    }
    .challenges-header h2 {
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* زر لوحة التحكم */
    .dashboard-nav-btn {
      background: var(--accent-gradient);
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      font-family: inherit;
    }
    .dashboard-nav-btn i {
      font-size: 1rem;
    }
    .dashboard-nav-btn:hover {
      transform: scale(1.02);
      filter: brightness(1.05);
    }

    .challenge-scroll {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 2rem;
      padding: 1.2rem 0.5rem 2.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--border-light);
      cursor: grab;
    }
    .challenge-scroll:active { cursor: grabbing; }
    .challenge-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .challenge-scroll::-webkit-scrollbar-track {
      background: var(--border-light);
      border-radius: 10px;
    }
    .challenge-scroll::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }

    .challenge-card {
      background: var(--card-bg);
      border-radius: 40px;
      min-width: 350px;
      max-width: 390px;
      flex: 0 0 auto;
      padding: 1.8rem;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      position: relative;
      overflow: hidden;
    }
    .challenge-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: var(--accent-gradient);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .challenge-card:hover::before {
      opacity: 1;
    }
    .challenge-card:hover {
      transform: translateY(-12px) scale(1.01);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.4rem;
    }
    .firm-name {
      font-size: 1.8rem;
      font-weight: 800;
      background: var(--accent-gradient);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .badge-difficulty {
      background: var(--badge-bg);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--badge-text);
    }

    .price-block {
      margin: 1.2rem 0;
      background: linear-gradient(145deg, var(--bg-page), var(--card-bg));
      border-radius: 30px;
      padding: 1rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border: 1px solid var(--border-light);
    }
    .fee {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
    }
    .profit-split {
      font-size: 1rem;
      font-weight: 800;
      background: var(--accent-gradient);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .stat-item {
      background: var(--bg-page);
      border-radius: 24px;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border-light);
    }
    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-value {
      font-weight: 800;
      font-size: 1rem;
    }
    .rule-line {
      font-size: 0.8rem;
      padding: 0.6rem 0;
      border-top: 1px dashed var(--border-light);
      display: flex;
      gap: 0.7rem;
      align-items: center;
      color: var(--text-secondary);
    }
    .rule-line i {
      width: 24px;
      color: var(--accent);
    }
    .buy-btn {
      width: 100%;
      margin-top: 1.2rem;
      background: var(--accent-gradient);
      border: none;
      padding: 0.9rem 0;
      border-radius: 60px;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3);
    }
    .buy-btn:hover {
      transform: scale(1.02);
      filter: brightness(1.05);
    }
    .footer-card {
      margin-top: 1rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      background: var(--bg-page);
      padding: 0.5rem;
      border-radius: 28px;
    }
    .scroll-arrow {
      display: flex;
      justify-content: flex-end;
      margin-top: -1rem;
      margin-bottom: 1rem;
    }
    .scroll-btn {
      background: var(--card-bg);
      border-radius: 40px;
      padding: 0.3rem 1rem;
      font-size: 0.75rem;
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-secondary);
    }
    .scroll-btn:hover {
      background: var(--accent);
      color: white;
    }
    @media (max-width: 750px) {
      .app-container { padding: 1rem; }
      .challenge-card { min-width: 290px; padding: 1.3rem; }
      .top-bar { border-radius: 32px; padding: 0.8rem 1.2rem; }
    }
  </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="app-container">
  <div class="top-bar" data-aos="fade-down">
    <div class="logo-area">
      <h1><i class="fas fa-chart-line"></i> CFDs Elite</h1>
      <p data-translate="hero_sub">تحديات تمويل احترافية | من 2000$ إلى أرباح غير محدودة</p>
    </div>
    <div class="controls">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ar">🇸🇦 عربي</button>
        <button class="lang-btn" data-lang="en">🇬🇧 ENG</button>
        <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
      </div>
      <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-sun"></i><i class="fas fa-moon"></i> <span data-translate="theme_btn">نمط</span>
      </div>
    </div>
  </div>

  <div class="challenges-header" data-aos="fade-right">
    <h2><i class="fas fa-rocket" style="color: var(--accent);"></i> <span data-translate="challenges_title">التحديات الممولة 2026</span></h2>
    <!-- زر "اسحب للمزيد" - الآن بدون فتح صفحة وهمية، يمكنك توجيهه لملف الداشبورد الخاص بك -->
    <button class="dashboard-nav-btn" id="dashboardBtn"><i class="fas fa-tachometer-alt"></i> <span data-translate="dashboard_btn">اسحب للمزيد</span></button>
  </div>
  
  <div class="scroll-arrow">
    <div class="scroll-btn" id="scrollRightBtn"><i class="fas fa-arrow-left"></i> التالي</div>
  </div>

  <div class="challenge-scroll" id="challengeContainer"></div>

  <div style="margin-top: 3.5rem; text-align: center; font-size: 0.75rem; background: var(--card-bg); padding: 1rem; border-radius: 48px; width: fit-content; margin-left: auto; margin-right: auto;">
    <span data-translate="footer_risk">تحذير المخاطر: التداول ينطوي على مخاطر عالية. تأكد من فهم القواعد قبل المشاركة.</span>
  </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  // --- بيانات التحديات (نفس المحتوى الأصلي) ---
  const challengesData = [
    { id: "ftmo", firm: "2k$", badge: "★ خطوة أولى", fee: "13$", profitTarget: "12%", maxDailyLoss: "4%", maxLoss: "8%", profitSplit: "", timeLimit: "غير محدود", minDays: "5", consistency: "الاتساق 40%", extra: "CFDs متقدمة", highlight: "دعم فوري 24/7" },
    { id: "fundednext", firm: "5k$", badge: "⭐ محترف", fee: "29$", profitTarget: "8%", maxDailyLoss: "3%", maxLoss: "7%", profitSplit: "", timeLimit: "غير محدود", minDays: "5", consistency: "الاتساق 40%", extra: "لا شروط صعبة ", highlight: "حتى 100k$" } ,  
    { id: "tft", firm: "10k$", badge: "♛ نخبة", fee: "67$", profitTarget: "10%", maxDailyLoss: "3%", maxLoss: "6%", profitSplit: "", timeLimit: "غير محدود", minDays: "5", consistency: "40% اتساق", extra: "استراد الرسوم ", highlight: "سحوبات أسبوعية" },
    { id: "myfundedfutures", firm: "50k$", badge: "⚡ مميز", fee: "119$", profitTarget: "10%", maxDailyLoss: "3%", maxLoss: "6%", profitSplit: "", timeLimit: "غير محدود", minDays: "5", consistency: "الاتساق 40%", extra: "اسعار جيدة ", highlight: "توسيع سريع" },
    { id: "capitalatlas_pro", firm: "100k$", badge: "🚀 احترافي", fee: "269$", profitTarget: "10%", maxDailyLoss: "3%", maxLoss: "6%", profitSplit: "", timeLimit: "غير محدود", minDays: "5", consistency: "40% اتساق", extra: "أدوات تحليلية", highlight: "أعلى نسبة أرباح" }
  ];

  const translations = {
    ar: {
      hero_sub: "تحديات تمويل احترافية | انطلق من 2000$",
      challenges_title: "التحديات الممولة 2026",
      theme_btn: "الوضع الداكن",
      footer_risk: "تحذير المخاطر: التداول يحمل مخاطر عالية، تأكد من قراءة الشروط بدقة.",
      profit_target_lbl: "هدف الربح",
      daily_loss_lbl: "الخسارة اليومية",
      max_loss_lbl: "الحد الأقصى للخسارة",
      profit_split_lbl: "Stellar Lite",
      time_limit_lbl: "المدة",
      min_days_lbl: "أيام التداول",
      consistency_lbl: "الاتساق",
      extra_info: "ميزات إضافية",
      fee_label: "رسوم التحدي",
      buy_btn: "🛒 اذهب للشراء",
      dashboard_btn: "رجوع ↪"
    },
    en: {
      hero_sub: "Professional funding challenges | From $2000 to unlimited profits",
      challenges_title: "Funded Challenges 2026",
      theme_btn: "Dark/Light",
      footer_risk: "Risk warning: Trading involves high risk. Understand rules before participating.",
      profit_target_lbl: "Profit Target",
      daily_loss_lbl: "Daily Loss",
      max_loss_lbl: "Max Drawdown",
      profit_split_lbl: "Profit Split",
      time_limit_lbl: "Time Limit",
      min_days_lbl: "Min Trading Days",
      consistency_lbl: "Consistency",
      extra_info: "Extra Features",
      fee_label: "Challenge Fee",
      buy_btn: "🛒 Go to Checkout",
      dashboard_btn: "Go to Dashboard →"
    },
    zh: {
      hero_sub: "专业融资挑战 | 从2000美元到高达95%利润分成",
      challenges_title: "2026 资金挑战",
      theme_btn: "深色/浅色",
      footer_risk: "风险警告: 交易存在高风险，参与前务必阅读规则。",
      profit_target_lbl: "盈利目标",
      daily_loss_lbl: "每日亏损",
      max_loss_lbl: "最大回撤",
      profit_split_lbl: "利润分成",
      time_limit_lbl: "时间限制",
      min_days_lbl: "最低交易天数",
      consistency_lbl: "一致性规则",
      extra_info: "附加功能",
      fee_label: "挑战费用",
      buy_btn: "🛒 去购买",
      dashboard_btn: "前往仪表板 📊"
    }
  };

  let currentLang = "ar";
  let darkMode = localStorage.getItem("darkMode") === "true";

  function applyTheme() {
    if (darkMode) document.body.classList.add("dark");
    else document.body.classList.remove("dark");
    localStorage.setItem("darkMode", darkMode);
  }

  function updateTexts() {
    const t = translations[currentLang];
    document.querySelectorAll("[data-translate]").forEach(el => {
      const key = el.getAttribute("data-translate");
      if (t[key]) el.innerText = t[key];
    });
    renderChallenges();
  }

  // ========== إزالة أي كود لصفحات وهمية ==========
  // الأزرار الآن ترسل فقط إشعاراً أو يمكنك توجيهها لملفاتك الخاصة بسهولة.
  // قم بتعديل الرابطين أدناه حسب مسار صفحاتك الحقيقية.
  const DASHBOARD_URL = "dashboard.html";      // <-- ضع هنا رابط صفحة الداشبورد الخاصة بك
  const CHECKOUT_BASE_URL = "checkout.html";   // <-- رابط صفحة الشراء/الخطط الخاصة بك

  function goToDashboard() {
    if (DASHBOARD_URL && DASHBOARD_URL !== "#") {
      window.location.href = DASHBOARD_URL;
    } else {
      alert("يرجى تحديد رابط لوحة التحكم في الكود.");
    }
  }

  function goToCheckout(planData) {
    // يمكن تمرير بيانات الخطة عبر query string إذا أردت
    if (CHECKOUT_BASE_URL && CHECKOUT_BASE_URL !== "#") {
      const params = new URLSearchParams({
        plan: planData.firm,
        fee: planData.fee,
        split: planData.profitSplit,
        target: planData.profitTarget
      });
      window.location.href = `${CHECKOUT_BASE_URL}?${params.toString()}`;
    } else {
      alert("يرجى تحديد رابط صفحة الشراء في الكود.");
    }
  }

  function renderChallenges() {
    const container = document.getElementById("challengeContainer");
    if (!container) return;
    const t = translations[currentLang];
    container.innerHTML = "";
    challengesData.forEach((ch, idx) => {
      const card = document.createElement("div");
      card.className = "challenge-card";
      card.setAttribute("data-aos", "fade-up");
      card.setAttribute("data-aos-delay", (idx * 50).toString());
      card.innerHTML = `
        <div class="card-header">
          <div class="firm-name">${ch.firm}</div>
          <div class="badge-difficulty">${ch.badge}</div>
        </div>
        <div class="price-block">
          <span class="fee"><i class="fas fa-coins"></i> ${ch.fee}</span>
          <span class="profit-split"><i class="fas fa-percent"></i> ${ch.profitSplit} <span>${t.profit_split_lbl}</span></span>
        </div>
        <div class="stats-grid">
          <div class="stat-item"><div class="stat-label"><i class="fas fa-bullseye"></i> ${t.profit_target_lbl}</div><div class="stat-value">${ch.profitTarget}</div></div>
          <div class="stat-item"><div class="stat-label"><i class="fas fa-chart-line"></i> ${t.daily_loss_lbl}</div><div class="stat-value">${ch.maxDailyLoss}</div></div>
          <div class="stat-item"><div class="stat-label"><i class="fas fa-draw-polygon"></i> ${t.max_loss_lbl}</div><div class="stat-value">${ch.maxLoss}</div></div>
          <div class="stat-item"><div class="stat-label"><i class="fas fa-clock"></i> ${t.time_limit_lbl}</div><div class="stat-value">${ch.timeLimit}</div></div>
          <div class="stat-item"><div class="stat-label"><i class="fas fa-calendar-week"></i> ${t.min_days_lbl}</div><div class="stat-value">${ch.minDays}</div></div>
          <div class="stat-item"><div class="stat-label"><i class="fas fa-scale-balanced"></i> ${t.consistency_lbl}</div><div class="stat-value">${ch.consistency}</div></div>
        </div>
        <div class="rule-line"><i class="fas fa-gift"></i> <span>${t.extra_info}: ${ch.extra}</span></div>
        <div class="rule-line"><i class="fas fa-star"></i> <span>✨ ${ch.highlight}</span></div>
        <button class="buy-btn" data-id="${ch.id}"><i class="fas fa-shopping-cart"></i> ${t.buy_btn}</button>
        <div class="footer-card"><hr><i class="fas fa-flag-checkered"></i> ${t.fee_label} ${ch.fee} • قواعد التمويل</div>
      `;
      container.appendChild(card);
    });
    // إضافة مستمعات أزرار الشراء
    document.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const planId = btn.getAttribute('data-id');
        const challenge = challengesData.find(c => c.id === planId);
        if (challenge) goToCheckout(challenge);
      });
    });
    if (window.AOS) AOS.refresh();
  }

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("lang", lang);
    const htmlTag = document.documentElement;
    if (lang === "ar") htmlTag.setAttribute("dir", "rtl");
    else htmlTag.setAttribute("dir", "ltr");
    updateTexts();
    document.querySelectorAll(".lang-btn").forEach(btn => {
      if(btn.getAttribute("data-lang") === lang) btn.classList.add("active");
      else btn.classList.remove("active");
    });
  }

  function initScroll() {
    const container = document.getElementById("challengeContainer");
    const scrollBtn = document.getElementById("scrollRightBtn");
    if (scrollBtn) scrollBtn.addEventListener("click", () => container.scrollBy({ left: 380, behavior: "smooth" }));
    let isDown = false, startX, scrollLeft;
    container.addEventListener("mousedown", (e) => { isDown = true; startX = e.pageX - container.offsetLeft; scrollLeft = container.scrollLeft; });
    container.addEventListener("mouseleave", () => isDown = false);
    container.addEventListener("mouseup", () => isDown = false);
    container.addEventListener("mousemove", (e) => { if(!isDown) return; e.preventDefault(); const walk = (e.pageX - container.offsetLeft - startX) * 1.2; container.scrollLeft = scrollLeft - walk; });
  }

  function init() {
    const savedLang = localStorage.getItem("lang");
    if (savedLang && translations[savedLang]) currentLang = savedLang;
    else currentLang = "ar";
    darkMode = localStorage.getItem("darkMode") === "true" || (localStorage.getItem("darkMode") === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
    applyTheme();
    setLanguage(currentLang);
    document.getElementById("themeToggle")?.addEventListener("click", () => { darkMode = !darkMode; applyTheme(); });
    document.querySelectorAll(".lang-btn").forEach(btn => btn.addEventListener("click", () => setLanguage(btn.getAttribute("data-lang"))));
    // زر الداشبورد: الآن يوجه إلى الرابط الذي تحدده أنت
    document.getElementById("dashboardBtn")?.addEventListener("click", goToDashboard);
    renderChallenges();
    initScroll();
    AOS.init({ duration: 700, once: true });
  }
  init();
</script>
</body>
</html>
